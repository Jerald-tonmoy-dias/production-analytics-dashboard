# Publish Storybook to Chromatic (public preview URL).
# Runs only when `main` is updated — not on pull requests.
# Requires repo secret CHROMATIC_PROJECT_TOKEN from https://www.chromatic.com

name: Chromatic

on:
  push:
    branches: [main]

concurrency:
  group: chromatic-main
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish Storybook to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true
          exitOnceUploaded: true
